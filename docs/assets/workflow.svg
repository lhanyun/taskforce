<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/>
    </marker>
  </defs>

  <rect width="800" height="240" rx="16" fill="#0d1117"/>

  <!-- Node: Describe -->
  <rect x="30" y="80" width="140" height="60" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="100" y="106" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="700">Describe</text>
  <text x="100" y="124" text-anchor="middle" fill="#8b949e" font-size="10">in natural language</text>

  <line x1="170" y1="110" x2="210" y2="110" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node: Launch -->
  <rect x="220" y="80" width="140" height="60" rx="10" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="290" y="106" text-anchor="middle" fill="#bc8cff" font-size="13" font-weight="700">Launch</text>
  <text x="290" y="124" text-anchor="middle" fill="#8b949e" font-size="10">workers in cmux</text>

  <line x1="360" y1="110" x2="400" y2="110" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node: Observe -->
  <rect x="410" y="80" width="140" height="60" rx="10" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <text x="480" y="106" text-anchor="middle" fill="#d29922" font-size="13" font-weight="700">Observe</text>
  <text x="480" y="124" text-anchor="middle" fill="#8b949e" font-size="10">read real TUIs</text>

  <line x1="550" y1="110" x2="590" y2="110" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Node: Decide -->
  <rect x="600" y="80" width="140" height="60" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="670" y="106" text-anchor="middle" fill="#3fb950" font-size="13" font-weight="700">Decide</text>
  <text x="670" y="124" text-anchor="middle" fill="#8b949e" font-size="10">continue / send / …</text>

  <!-- Loop arrow -->
  <path d="M 670 140 Q 670 195 480 195 Q 290 195 290 140" fill="none" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrowG)">
    <animate attributeName="stroke-dashoffset" from="0" to="-18" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <text x="480" y="210" text-anchor="middle" fill="#3fb950" font-size="11" font-weight="600">supervisor loop</text>

  <!-- Animated dot traveling the loop -->
  <circle r="4" fill="#3fb950">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 670 140 Q 670 195 480 195 Q 290 195 290 140"/>
  </circle>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="url(#g1)" font-size="16" font-weight="800" letter-spacing="1">SUPERVISED AGENT LOOP</text>
  <text x="400" y="60" text-anchor="middle" fill="#8b949e" font-size="12">Launch → Observe → Decide → Repeat</text>
</svg>
